[project]
name = "pwrbnb"
version = "0.1.0"
description = "Local evidence-backed datacenter power, planning, and permitting research"
readme = "README.md"
authors = [
    { name = "akshaycrcan", email = "akshayjaincr@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "openai>=3.28.0",
    "pydantic>=2.14.0",
    "pydeck>=0.9.3",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65,<2",
]

[project.scripts]
pwrbnb = "pwrbnb:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
